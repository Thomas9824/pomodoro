<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Itim&family=Outfit:wght@400;500;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff6f1; --bg2:#fdebe4; --card:#fffaf6; --ink:#1d1818; --muted:#7d716d; --faint:#aa9e99;
  --red:#d3202a; --pink:#fde6e1; --pink-line:#f2c6bd; --line:#f1e3dc; --blue:#2a6ad0; --green:#3b9b47;
  --seg:#f7ebe5; --seg-on:#fffaf6; --overlay:rgba(60,30,22,.32);
  --shadow:0 40px 90px -40px rgba(170,70,50,.38), 0 1px 0 rgba(255,255,255,.9) inset;
  --item-shadow:0 1px 0 rgba(180,110,95,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#1b1413; --bg2:#150f0e; --card:#251b1a; --ink:#f7ece8; --muted:#b2a49f; --faint:#7d6f6a;
    --red:#ff6a70; --pink:#3a2523; --pink-line:#5c3733; --line:#372927; --blue:#6ea2ff; --green:#5cc26a;
    --seg:#2e2220; --seg-on:#3a2a28; --overlay:rgba(0,0,0,.55);
    --shadow:0 40px 90px -40px rgba(0,0,0,.8); --item-shadow:0 1px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg1:#1b1413; --bg2:#150f0e; --card:#251b1a; --ink:#f7ece8; --muted:#b2a49f; --faint:#7d6f6a;
  --red:#ff6a70; --pink:#3a2523; --pink-line:#5c3733; --line:#372927; --blue:#6ea2ff; --green:#5cc26a;
  --seg:#2e2220; --seg-on:#3a2a28; --overlay:rgba(0,0,0,.55);
  --shadow:0 40px 90px -40px rgba(0,0,0,.8); --item-shadow:0 1px 0 rgba(0,0,0,.3);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;padding:24px;display:flex;align-items:center;justify-content:center;
  background-color:var(--bg1);
  background-image:radial-gradient(ellipse 80% 60% at 50% 0%,var(--bg2),transparent 70%);
  color:var(--ink);font-family:"Patrick Hand","Segoe UI",system-ui,sans-serif;
  overflow-y:auto;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,li:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- Card ---------- */
.card{
  width:100%;max-width:1000px;height:min(620px,100%);min-height:560px;
  display:grid;grid-template-columns:minmax(260px,35%) 1fr;
  background:var(--card);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;
  transition:grid-template-columns .45s cubic-bezier(.6,.05,.2,1);
}
.card.collapsed{grid-template-columns:0 1fr}

/* ---------- Sidebar ---------- */
.side{min-width:0;overflow:hidden;border-right:1px solid var(--line);transition:border-color .3s}
.card.collapsed .side{border-right-color:transparent}
.side-in{min-width:280px;height:100%;padding:30px 30px 22px 34px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:34px}
.logo svg{width:34px;height:34px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.logo:hover svg{transform:rotate(-12deg) scale(1.12)}
.logo span{font-family:"Itim",cursive;font-size:30px;color:var(--red);line-height:1}
.lbl{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.focus-title{font-family:"Itim",cursive;font-weight:400;font-size:27px;line-height:1.1;margin:8px 0 3px;letter-spacing:-.01em;word-break:break-word}
.focus-sub{font-size:14px;color:var(--muted)}
.add-link{margin-top:22px;font-size:14px;color:var(--red);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;align-self:flex-start}
.add-form{margin-top:16px;display:none;gap:8px;flex-direction:column}
.add-form.open{display:flex;animation:slidein .3s ease-out}
.add-form .row{display:flex;gap:8px}
.field{
  font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--pink-line);
  border-radius:10px;padding:7px 10px;min-width:0;
}
.field::placeholder{color:var(--faint)}
.add-form .name{flex:1}
.add-form .mins{width:66px}
.mini{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:7px 14px;border:1.5px solid var(--red);color:var(--red)}
.mini.fill{background:var(--red);color:var(--card)}
.today{margin-top:26px}
#list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:182px;overflow-y:auto;padding-right:2px}
#list li{
  position:relative;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--item-shadow);cursor:pointer;
  transition:background .25s,border-color .25s,transform .15s;
}
#list li:hover{transform:translateY(-1px)}
#list li.new{animation:slidein .4s cubic-bezier(.3,1.4,.5,1)}
#list li.sel{background:var(--pink);border-color:var(--pink-line);border-bottom:2px solid var(--pink-line)}
#list li svg.leaf{width:18px;height:18px;flex:none;transform-origin:50% 90%}
#list li.sel svg.leaf{animation:leafwig 3.6s ease-in-out infinite}
#list li .t{flex:1;min-width:0}
#list li .n{font-family:"Itim",cursive;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list li .m{font-size:12px;color:var(--muted)}
#list li.done .n{text-decoration:line-through;color:var(--muted)}
#list li .st{font-family:"DM Mono",monospace;font-size:8.5px;letter-spacing:.14em;color:var(--blue);align-self:flex-start;margin-top:2px}
#list li .x{display:none;position:absolute;right:6px;top:5px;width:20px;height:20px;border-radius:50%;font-size:14px;line-height:18px;color:var(--faint);background:var(--card)}
#list li:hover .x,#list li:focus-within .x{display:block}
#list li:hover .st,#list li:focus-within .st{opacity:0}
#list li .x:hover{color:var(--red)}
.empty{font-size:14px;color:var(--faint);padding:6px 2px}
.spacer{flex:1;min-height:14px}
.harvest{display:flex;align-items:center;gap:7px;margin:10px 0 14px;font-size:14px}
.harvest svg{width:17px;height:17px}
.harvest b{font-family:"Itim",cursive;font-weight:400;font-size:17px;color:var(--red);display:inline-block}
.harvest b.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
.harvest span{color:var(--muted)}
.foot{margin:0;font-size:12px;color:var(--faint)}

/* ---------- Main ---------- */
.main{min-width:0;display:flex;flex-direction:column;padding:22px 26px 22px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ibtn{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);color:var(--muted);transition:color .2s,border-color .2s,transform .3s;
}
.ibtn:hover{color:var(--red);border-color:var(--pink-line)}
.ibtn:active{transform:scale(.9)}
#resetBtn:hover svg{transform:rotate(-40deg)}
#setBtn:hover svg{transform:rotate(60deg)}
.ibtn svg{width:15px;height:15px;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.ibtn.flip svg{transform:rotate(180deg)}
.right{display:flex;gap:8px}
.seg{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--seg);box-shadow:inset 0 1px 3px rgba(150,90,70,.14)}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--seg-on);box-shadow:0 1px 3px rgba(150,90,70,.2);transition:transform .4s cubic-bezier(.4,1.3,.5,1),width .4s cubic-bezier(.4,1.3,.5,1)}
.seg button{
  position:relative;font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  padding:8px 18px;border-radius:999px;transition:color .25s;
}
.seg button.on{color:var(--blue)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#time{
  display:flex;justify-content:center;
  font-family:"Outfit",sans-serif;font-weight:500;font-size:clamp(64px,9vw,92px);line-height:1;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0 18px;
}
#time .d{display:inline-block}
#time .d.flip{animation:roll .38s cubic-bezier(.2,.9,.3,1.2)}
#time.live .colon{animation:colon 1s steps(1,end) infinite}
#time.swap{animation:timepop .5s cubic-bezier(.3,1.6,.5,1)}
.stage{position:relative;width:clamp(200px,28vw,280px);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
.stage svg{display:block;width:100%;height:auto;overflow:visible}
.caption{font-size:16px;color:var(--muted);margin:10px 0 18px;min-height:20px;text-align:center}
.caption.fade{animation:capin .45s ease-out}
.go{
  width:min(282px,80%);height:38px;border:1.5px solid var(--red);border-radius:999px;color:var(--red);
  font-family:"DM Mono",monospace;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  transition:background .25s,color .25s,transform .15s,box-shadow .25s;
}
.go:hover{background:var(--pink);box-shadow:0 6px 18px -8px var(--red)}
.go:active{transform:scale(.97)}
.go.running{background:var(--red);color:var(--card)}
.dots{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:20px;font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.14em;color:var(--muted)}
.dots i{width:9px;height:9px;border-radius:50%;border:1.3px solid var(--red);transition:background .3s,transform .3s}
.dots i.on{background:var(--red);animation:dotpop .5s cubic-bezier(.3,1.8,.5,1)}
.dots i.cur{transform:scale(1.25)}
.dots i.cur.live{animation:pulse 1.6s ease-in-out infinite}
.dots em{font-style:normal;margin-left:2px}

/* ---------- Settings ---------- */
.ovl{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.ovl.open{display:flex;animation:fadein .2s ease-out}
.ovl.open .modal{animation:modalin .35s cubic-bezier(.3,1.4,.5,1)}
.modal{width:min(360px,100%);background:var(--card);border-radius:24px;padding:26px 26px 22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal h2{font-family:"Itim",cursive;font-weight:400;font-size:24px;margin:0 0 18px}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.set small{display:block;font-size:12px;color:var(--faint)}
.set .field{width:70px;text-align:center}
.tog{width:44px;height:26px;border-radius:999px;background:var(--seg);border:1px solid var(--pink-line);position:relative;transition:background .25s;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tog[aria-checked="true"]{background:var(--red)}
.tog[aria-checked="true"]::after{transform:translateX(18px)}
.modal .acts{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.danger{font-size:14px;color:var(--faint);text-decoration:underline;text-underline-offset:3px}
.danger.arm{color:var(--red)}

/* ---------- Character : visibilité des états ---------- */
.char .p-break,.char .p-focus,.char .p-run,.char .p-cheer,.char .p-paused{display:none}
.char.break .p-break,.char.focus .p-focus{display:inline}
.char.focus.run .p-run{display:inline}
.char.paused .p-paused{display:inline}
.char.cheer .p-cheer{display:inline}
.char.cheer .p-break,.char.cheer .p-focus,.char.cheer .p-paused,.char.cheer .p-run{display:none}
.e-closed,.e-open,.e-happy,.e-sleepy,.m-smile,.m-flat,.m-open{opacity:0}
.char[data-face="closed"] .e-closed,.char[data-face="open"] .e-open,
.char[data-face="happy"] .e-happy,.char[data-face="sleepy"] .e-sleepy,
.char[data-mouth="smile"] .m-smile,.char[data-mouth="flat"] .m-flat,.char[data-mouth="open"] .m-open{opacity:1}
.e-closed,.e-open,.e-happy,.e-sleepy,.m-smile,.m-flat,.m-open{transition:opacity .18s ease}

/* ---------- Character : mouvements ---------- */
.char{--hy:0px;--ly:0px}
.char.run{--hy:2px;--ly:2.8px}
.char.paused{--hy:5px;--ly:3px}
.char.cheer{--hy:-3px}
.puppet{transform-origin:160px 248px;animation:idle-sway 5.6s ease-in-out infinite}
.char.run .puppet{animation:work-bounce .55s cubic-bezier(.45,.1,.55,1) infinite}
.char.paused .puppet{animation:drowsy-body 5.2s ease-in-out infinite}
.char.cheer .puppet{animation:cheer-bounce .38s cubic-bezier(.33,1.4,.45,1) infinite}
.head-track{
  transform:translate(calc(var(--ex,0)*2.6px),var(--hy)) rotate(calc(var(--ex,0)*3deg));
  transform-origin:160px 165px;transition:transform .4s cubic-bezier(.22,.8,.28,1);
}
.head-sip{transform-origin:160px 165px}
.char.break:not(.cheer):not(.paused) .head-sip{animation:sip-nod 5.5s cubic-bezier(.45,.12,.4,1) infinite}
.char.focus.run .head-sip{animation:look-down 1.15s ease-in-out infinite}
.char.paused .head-sip{animation:nod-off 5.4s cubic-bezier(.4,.1,.4,1) infinite}
.char.cheer .head-sip{animation:cheer-head .38s ease-in-out infinite alternate}
.head{animation:bob 4.2s ease-in-out infinite;transform-origin:160px 165px}
.char.focus.run .head{animation:bob-work 1.05s ease-in-out infinite}
.char.break:not(.cheer) .head{animation:bob-break 4s ease-in-out infinite}
.char.paused .head{animation:bob-sleepy 3.6s ease-in-out infinite}
.leaf-l,.leaf-r,.leaf-c{transform-box:fill-box;transform-origin:50% 90%}
.leaf-l{animation:sway 2.55s ease-in-out infinite}
.leaf-r{animation:sway 2.95s ease-in-out .35s infinite reverse}
.leaf-c{animation:sway-c 2.2s ease-in-out .1s infinite}
.char.cheer .leaf-l,.char.cheer .leaf-r,.char.cheer .leaf-c{animation-duration:.32s}
.char.run .leaf-l,.char.run .leaf-r,.char.run .leaf-c{animation-duration:1.1s}
.torso{animation:breathe 3.8s ease-in-out infinite;transform-origin:160px 228px}
.char.run .torso{animation:breathe-work .55s ease-in-out infinite}
.char.paused .torso{animation:breathe 5.4s ease-in-out infinite}
.cushion{animation:cush 3.8s ease-in-out infinite;transform-origin:160px 272px}
.shadow{animation:shad 3.8s ease-in-out infinite;transform-origin:160px 272px}
.char.run .cushion{animation:cush-work .55s ease-in-out infinite}
.char.run .shadow{animation:shad-work .55s ease-in-out infinite}
.foot-r{transform-origin:184px 236px;animation:foot 5.8s ease-in-out infinite}
.foot-l{transform-origin:136px 236px;animation:foot 5.8s ease-in-out 2.7s infinite}
.char.run .foot-l{animation:foot-tap .55s ease-in-out infinite}
.char.run .foot-r{animation:foot-tap .55s ease-in-out .27s infinite}
.blink{animation:blink 5.2s ease-in-out infinite;transform-origin:160px 123px}
.char.run .blink{animation-duration:3.4s}
.char.paused .blink{animation:none}
.pupils{transform:translate(calc(var(--ex,0)*3.6px),calc(var(--ey,0)*2.6px + var(--ly)));transition:transform .28s cubic-bezier(.22,.8,.28,1)}
.brows{transition:transform .28s cubic-bezier(.22,.8,.28,1);transform-origin:160px 111px}
.char.run .brows{transform:translateY(2.5px) scaleY(.92)}
.char.paused .brows{transform:translateY(3px)}
.cheek{animation:cheek 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.char.cheer .cheek{animation:cheek-glow .4s ease-in-out infinite}
.steam path{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:steam 2.8s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.7s}.steam path:nth-child(3){animation-delay:1.4s}
.nb{transform-origin:186px 200px;transform:rotate(-6deg)}
.char.focus.run .nb{animation:nb-wiggle 1.15s ease-in-out infinite}
.ink{stroke-dasharray:1;stroke-dashoffset:1}
.char.focus:not(.run) .ink{stroke-dashoffset:0}
.char.run .ink{animation:ink 1.15s cubic-bezier(.4,.1,.3,1) infinite}
.char.run .ink.i3{animation-delay:.38s}
.writer{transform-origin:197px 192px;animation:tap 3.4s ease-in-out infinite}
.char.run .writer{animation:write 1.15s cubic-bezier(.42,.08,.45,1) infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 1.5s ease-in-out infinite}
.spark.b{animation-delay:.38s}.spark.c{animation-delay:.72s}.spark.d{animation-delay:1.05s}.spark.e{animation-delay:.18s}
.pd{animation:pd 1.25s ease-in-out infinite}.pd.b{animation-delay:.2s}.pd.c{animation-delay:.4s}
.pop{animation:popin .55s cubic-bezier(.2,1.3,.4,1) both;transform-box:fill-box;transform-origin:50% 100%}
.arm-up-l{transform-origin:126px 172px;animation:wave .28s cubic-bezier(.45,.1,.55,1) infinite alternate}
.arm-up-r{transform-origin:196px 166px;animation:wave .28s cubic-bezier(.45,.1,.55,1) .14s infinite alternate-reverse}
.zz{font-family:"Itim",cursive;fill:#9c8d87;opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center}
.zz.a{animation:zzz 2.6s ease-out infinite;font-size:13px}
.zz.b{animation:zzz 2.6s ease-out .85s infinite;font-size:17px}
.zz.c{animation:zzz 2.6s ease-out 1.7s infinite;font-size:21px}
.shine{animation:shine 4.8s ease-in-out infinite}

@keyframes idle-sway{0%,100%{transform:rotate(-.7deg) translateY(0)}28%{transform:rotate(.5deg) translateY(-1.5px)}55%{transform:rotate(.9deg) translateY(0)}78%{transform:rotate(-.4deg) translateY(-1px)}}
@keyframes work-bounce{0%,100%{transform:translateY(0) scale(1,.99) rotate(-.4deg)}50%{transform:translateY(2.5px) scale(1.02,.96) rotate(.6deg)}}
@keyframes drowsy-body{0%,100%{transform:rotate(3deg) translateY(3px) scale(1.01,.97)}42%{transform:rotate(5deg) translateY(6px) scale(1.03,.94)}58%{transform:rotate(1.5deg) translateY(1px) scale(1,.99)}78%{transform:rotate(4deg) translateY(4px) scale(1.02,.96)}}
@keyframes cheer-bounce{0%,100%{transform:translateY(0) scale(1.02,.96) rotate(-4deg)}50%{transform:translateY(-11px) scale(.94,1.08) rotate(4deg)}}
@keyframes sip-nod{0%,52%,78%,100%{transform:rotate(0) translate(0,0)}8%{transform:rotate(-3deg) translateY(2px)}18%,38%{transform:rotate(9deg) translate(1px,5px)}46%{transform:rotate(2deg) translateY(1px)}}
@keyframes look-down{0%,100%{transform:rotate(5deg) translateY(2px)}50%{transform:rotate(8deg) translateY(4.5px)}}
@keyframes nod-off{0%,12%,100%{transform:rotate(5deg) translateY(3px)}38%,48%{transform:rotate(16deg) translateY(11px)}60%{transform:rotate(2deg) translateY(1px)}74%{transform:rotate(7deg) translateY(4px)}}
@keyframes cheer-head{from{transform:rotate(-10deg) translateY(-3px) scale(1.05)}to{transform:rotate(10deg) translateY(-5px) scale(1.08)}}
@keyframes bob{0%{transform:rotate(0) translate(0,0)}16%{transform:rotate(-1.8deg) translate(-.6px,-2.8px)}34%{transform:rotate(.7deg) translate(.9px,-.8px)}52%{transform:rotate(-2.4deg) translate(-.3px,-3.6px)}71%{transform:rotate(1.4deg) translate(1.1px,-.4px)}88%{transform:rotate(-.9deg) translate(-.4px,-2.1px)}100%{transform:rotate(0) translate(0,0)}}
@keyframes bob-break{0%,100%{transform:rotate(0) translateY(0)}35%{transform:rotate(-2.2deg) translateY(-3px)}68%{transform:rotate(1.2deg) translateY(-1.2px)}}
@keyframes bob-work{0%,100%{transform:rotate(3deg) translateY(2px)}50%{transform:rotate(5deg) translateY(3.5px)}}
@keyframes bob-sleepy{0%,100%{transform:rotate(4deg) translateY(4px)}50%{transform:rotate(6deg) translateY(5.5px)}}
@keyframes sway{0%,100%{transform:rotate(-8deg)}40%{transform:rotate(10deg)}70%{transform:rotate(-3deg)}}
@keyframes sway-c{0%,100%{transform:rotate(-4deg) scaleY(1)}50%{transform:rotate(5deg) scaleY(1.06)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}22%{transform:scale(1.016,1.038)}48%{transform:scale(1.006,1.012)}74%{transform:scale(1.02,1.032)}}
@keyframes breathe-work{0%,100%{transform:scale(1,1) translateY(0)}50%{transform:scale(1.03,.97) translateY(2px)}}
@keyframes cush{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.978)}}

<!-- Settings -->
<div class="ovl" id="ovl">

<script>
(function(){
  var $ = function(s){return document.querySelector(s)};
  var KEY = 'pomato:v1';
  var RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- State ---------- */
  function defaults(){
    return {
      sessions:[
        {id:1,name:'Organize Files',min:25,rem:1500,status:'paused'},
        {id:2,name:'Add Animations',min:15,rem:900,status:'idle'}
      ],
      sel:2,nextId:3,done:0,harvest:{count:0,min:0},
      settings:{brk:5,lng:15,sound:true}
    };
  }
  function load(){
    var base = defaults();
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return base;
      var d = JSON.parse(raw);
      if(!d || typeof d !== 'object') return base;
      if(Array.isArray(d.sessions)){
        base.sessions = d.sessions.filter(function(s){
          return s && typeof s.id === 'number' && typeof s.name === 'string';
        }).map(function(s){
          var min = Math.max(1, Math.min(180, parseInt(s.min,10) || 25));
          var rem = typeof s.rem === 'number' ? Math.max(0, Math.min(min*60, s.rem)) : min*60;
          var status = s.status;
          if(status==='running') status = 'paused';
          if(status!=='done' && status!=='paused' && status!=='idle') status = rem>0 && rem<min*60 ? 'paused' : 'idle';
          if(status==='done') rem = 0;
          return {id:s.id, name:String(s.name).slice(0,40), min:min, rem:rem, status:status};
        });
      }
      if(typeof d.nextId === 'number' && d.nextId>0) base.nextId = d.nextId;
      else {
        base.nextId = 1;
        base.sessions.forEach(function(s){ if(s.id>=base.nextId) base.nextId = s.id+1; });
      }
      if(d.sel==null || !base.sessions.some(function(s){ return s.id===d.sel; })){
        base.sel = base.sessions.length ? base.sessions[0].id : null;
      } else base.sel = d.sel;
      if(typeof d.done === 'number' && d.done>=0) base.done = d.done;
      if(d.harvest && typeof d.harvest === 'object'){
        if(typeof d.harvest.count === 'number') base.harvest.count = Math.max(0, d.harvest.count);
        if(typeof d.harvest.min === 'number') base.harvest.min = Math.max(0, d.harvest.min);
      }
      if(d.settings && typeof d.settings === 'object'){
        if(typeof d.settings.brk === 'number') base.settings.brk = Math.max(1, Math.min(60, d.settings.brk));
        if(typeof d.settings.lng === 'number') base.settings.lng = Math.max(1, Math.min(90, d.settings.lng));
        if(typeof d.settings.sound === 'boolean') base.settings.sound = d.settings.sound;
      }
      base.mode = d.mode==='break' ? 'break' : 'focus';
      if(typeof d.brkRem === 'number') base.brkRem = Math.max(0, d.brkRem);
      base.running = !!d.running;
      base.endAt = typeof d.endAt === 'number' ? d.endAt : 0;
      return base;
    }catch(e){ return defaults(); }
  }
  function snapshot(){
    return {
      sessions: S.sessions,
      sel: S.sel,
      nextId: S.nextId,
      done: S.done,
      harvest: S.harvest,
      settings: S.settings,
      mode: mode,
      brkRem: brkRem,
      running: running,
      endAt: running ? endAt : 0
    };
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(snapshot())); }catch(e){}
  }
  function persistNow(){
    if(running) setRem(Math.max(0, Math.ceil((endAt-Date.now())/1000)));
    save();
  }

  var S = load();
  var mode = S.mode==='break' ? 'break' : 'focus';
  var running = false, endAt = 0, timer = null, brkRem = 0, audio = null;
  var cheering = false, hovering = false, sipOn = false, newId = null, lastCount = S.harvest.count, lastMode = mode, cheerTO = null, lastPersist = 0;

  function cur(){ for(var i=0;i<S.sessions.length;i++) if(S.sessions[i].id===S.sel) return S.sessions[i]; return null; }
  function breakLen(){ return ((S.done>0 && S.done%6===0) ? S.settings.lng : S.settings.brk) * 60; }
  function total(){ if(mode==='break') return breakLen(); var s=cur(); return s ? s.min*60 : 1500; }
  function getRem(){ if(mode==='break') return brkRem; var s=cur(); return s ? s.rem : 1500; }
  function setRem(v){ if(mode==='break') brkRem=v; else { var s=cur(); if(s) s.rem=v; } }
  function fmt(s){ var m=Math.floor(s/60), r=s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }
  brkRem = typeof S.brkRem === 'number' ? S.brkRem : breakLen();

  /* ---------- Audio ---------- */
  function ensureAudio(){
    try{
      if(!audio){ var C = window.AudioContext||window.webkitAudioContext; if(C) audio = new C(); }
      if(audio && audio.state==='suspended') audio.resume();
    }catch(e){}
  }
  function chime(){
    if(!S.settings.sound || !audio) return;
    try{
      var t = audio.currentTime;
      [659.25,783.99,1046.5].forEach(function(f,i){
        var o = audio.createOscillator(), g = audio.createGain();
        o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(audio.destination);

        g.gain.exponentialRampToValueAtTime(.0001,s+.9);
        o.start(s); o.stop(s+1);
      });
    }catch(e){}
  }

  /* ---------- Timer ---------- */
  function tick(){
    var r = Math.max(0, Math.ceil((endAt-Date.now())/1000));
    setRem(r);
    renderTime(true);
    if(Date.now()-lastPersist>5000){ lastPersist = Date.now(); save(); }
    if(r<=0) complete();
  }
  function start(){
    ensureAudio();
    if(mode==='focus'){
      var s = cur();
      if(!s){ openAdd(); return; }
      if(s.status==='done'){ s.rem = s.min*60; }
      s.status = 'running';
    }
    if(getRem()<=0) setRem(total());
    endAt = Date.now()+getRem()*1000;
    running = true;
    clearInterval(timer); timer = setInterval(tick,250);
    save(); render();
  }
  function stop(){
    if(running){
      setRem(Math.max(0, Math.ceil((endAt-Date.now())/1000)));
    }
    running = false; clearInterval(timer);
    var s = cur();
    if(mode==='focus' && s && s.status==='running') s.status = (s.rem<s.min*60 && s.rem>0) ? 'paused' : 'idle';
    save();
  }
  function pause(){ stop(); render(); }
  function complete(){
    clearInterval(timer); running = false;
    chime();
    var wasFocus = (mode==='focus');
    if(wasFocus){
      var s = cur();
      if(s){ s.status='done'; s.rem=0; S.harvest.count++; S.harvest.min += s.min; S.done++; }
      mode='break'; brkRem = breakLen();
    } else {
      mode='focus';
      var next = null;
      for(var i=0;i<S.sessions.length;i++){ if(S.sessions[i].status!=='done'){ next=S.sessions[i]; break; } }
      if(next) S.sel = next.id;
    }
    celebrate(wasFocus);
    save(); render();
  }
  function resetTimer(){
    stop();
    if(mode==='focus'){ var s=cur(); if(s){ s.rem=s.min*60; s.status='idle'; } }
    else brkRem = breakLen();
    save(); render();
  }
  function setMode(m){
    if(m===mode) return;
    stop(); mode=m;
    if(m==='break') brkRem = breakLen();
    save(); render();
  }

  /* ---------- Rendu : chrono à chiffres animés ---------- */
  var lastStr = '';
  function setTimeText(str, animate){
    var el = $('#time');
    if(str.length!==lastStr.length){
      el.innerHTML = '';
      for(var i=0;i<str.length;i++){
        var sp = document.createElement('span');
        sp.className = str[i]===':' ? 'colon' : 'd';
        sp.textContent = str[i];
        el.appendChild(sp);
      }
    } else {
      for(var j=0;j<str.length;j++){
        if(str[j]!==lastStr[j]){
          var c = el.children[j]; c.textContent = str[j];
          if(animate && !RM && str[j]!==':'){ c.classList.remove('flip'); void c.offsetWidth; c.classList.add('flip'); }
        }
      }
    }
    lastStr = str;
  }
  function renderTime(animate){
    var r = getRem();
    setTimeText(fmt(r), animate);
    $('#time').classList.toggle('live', running);
    document.title = running ? fmt(r)+' · '+(mode==='focus'?'Focus':'Break')+' · Pomato' : 'Pomato';
  }

  var segF=$('#segFocus'), segB=$('#segBreak'), goBtn=$('#go'), charEl=$('#char'), pill=$('#pill'), lastCap='';
  function movePill(){
    var b = mode==='focus' ? segF : segB;
    pill.style.width = b.offsetWidth+'px';
    pill.style.transform = 'translateX('+(b.offsetLeft-4)+'px)';
  }

  function render(){
    var s = cur(), r = getRem(), t = total();
    $('#focusTitle').textContent = s ? s.name : 'Nothing yet';
    $('#focusSub').textContent = s ? s.min+' min session' : 'add a session to begin';
    renderTime(false);
    if(mode!==lastMode){
      lastMode = mode;
      var tm = $('#time'); tm.classList.remove('swap'); void tm.offsetWidth; if(!RM) tm.classList.add('swap');
    }

    segF.classList.toggle('on', mode==='focus'); segF.setAttribute('aria-selected', mode==='focus');
    segB.classList.toggle('on', mode==='break'); segB.setAttribute('aria-selected', mode==='break');
    movePill();

    var paused = !running && r<t && r>0;
    var finished = mode==='focus' && s && s.status==='done';
    var label;
    if(running) label='Pause';
    else if(paused) label='Resume';
    else if(finished) label='Do it again';
    else if(!s && mode==='focus') label='Add a session';
    else label = mode==='focus' ? 'Start focus' : 'Start break';
    goBtn.textContent = label;
    goBtn.classList.toggle('running', running);

    var cap;
    if(cheering){
      cap = mode==='break' ? 'yay! one tomato harvested' : 'welcome back!';
    } else if(mode==='focus'){
      cap = running ? 'one tomato at a time' : paused ? 'paused, no rush' : finished ? 'this tomato is harvested!' : !s ? 'plant a new session' : 'ready when you are';
    } else {
      cap = running ? 'sip, breathe, relax' : paused ? 'paused, no rush' : 'take a little stretch';
    }
    var capEl = $('#caption');
    if(cap!==lastCap){
      capEl.textContent = cap; lastCap = cap;
      capEl.classList.remove('fade'); void capEl.offsetWidth; if(!RM) capEl.classList.add('fade');
    }

    updateChar();

    var filled = (S.done>0 && S.done%6===0 && mode==='break') ? 6 : S.done%6;
    var cn = mode==='focus' ? Math.min(filled+1,6) : Math.max(filled,1);
    var dots = '';
    for(var i=0;i<6;i++){
      var cls = (i<filled?'on':'') + ((i===cn-1 && mode==='focus')?' cur':'') + ((i===cn-1 && mode==='focus' && running)?' live':'');
      dots += '<i class="'+cls+'"></i>';
    }
    $('#dots').innerHTML = dots+'<em>SESSION '+cn+' OF 6</em>';

    var hc = $('#hCount');
    hc.textContent = S.harvest.count;
    if(S.harvest.count>lastCount){ hc.classList.remove('bump'); void hc.offsetWidth; hc.classList.add('bump'); }
    lastCount = S.harvest.count;
    $('#hMin').textContent = S.harvest.min+' min focused';
    renderList();
  }
  function renderList(){
    var ul = $('#list'); ul.innerHTML = '';
    if(!S.sessions.length){
      var e = document.createElement('div'); e.className='empty'; e.textContent='No sessions yet. Add your first one.';
      ul.appendChild(e); return;
    }
    S.sessions.forEach(function(s){
      var li = document.createElement('li');
      li.tabIndex = 0; li.dataset.id = s.id;
      li.className = (s.id===S.sel?'sel ':'')+(s.status==='done'?'done ':'')+(s.id===newId?'new':'');
      var st = '';
      if(s.status==='done') st='DONE';
      else if(s.id===S.sel && running && mode==='focus') st='FOCUSING';
      else if(s.status==='paused') st='PAUSED';
      li.innerHTML = '<svg class="leaf"><use href="#leaf"/></svg><div class="t"><div class="n"></div><div class="m"></div></div><span class="st"></span><button class="x" type="button" aria-label="Delete session">×</button>';
      li.querySelector('.n').textContent = s.name;
      li.querySelector('.m').textContent = s.min+' min';
      li.querySelector('.st').textContent = st;
      ul.appendChild(li);
    });
    newId = null;
  }

  /* ---------- Personnage : état visuel ---------- */
  var lastPose = '';
  function syncSip(paused){
    var want = (mode==='break' && !cheering && !paused && !RM);
    if(want===sipOn) return;
    sipOn = want;
    var a = charEl.querySelectorAll('.sip');
    for(var i=0;i<a.length;i++){
      try{ want ? a[i].beginElement() : a[i].endElement(); }catch(e){}
    }
  }
  function updateChar(){
    var r = getRem(), t = total();
    var paused = !running && r<t && r>0;
    var face, mouth;
    if(cheering){ face='happy'; mouth='open'; }
    else if(hovering){ face='happy'; mouth='smile'; }
    else if(mode==='break'){ face='closed'; mouth='smile'; }
    else if(paused){ face='sleepy'; mouth='smile'; }
    else { face='open'; mouth = running ? 'flat' : 'smile'; }
    var pose = mode+(running?'-run':'')+(paused?'-paused':'')+(cheering?'-cheer':'');
    charEl.setAttribute('class','char '+mode+(running?' run':'')+(paused?' paused':'')+(cheering?' cheer':''));
    charEl.setAttribute('data-face',face);
    charEl.setAttribute('data-mouth',mouth);
    if(pose!==lastPose){
      lastPose = pose;
      if(!RM){
        var pops = charEl.querySelectorAll('.pop');
        for(var i=0;i<pops.length;i++){
          pops[i].style.animation='none';
          void pops[i].getBoundingClientRect();
          pops[i].style.animation='';
        }
      }
    }
    syncSip(paused);
  }

  var stage = $('#stage');
  function hop(cls){
    stage.classList.remove('hop','hop3'); void stage.offsetWidth; if(!RM) stage.classList.add(cls||'hop');
  }
  function confetti(){
    if(RM) return;
    var colors = ['#ee1c1c','#3da34a','#ffc83d','#2a6ad0','#ff8f9c','#ffffff'];
    for(var i=0;i<36;i++){
      var p = document.createElement('span');
      p.className = 'conf'+(Math.random()<.35?' round':'');
      p.style.background = colors[i%colors.length];
      p.style.setProperty('--dx', ((Math.random()-.5)*360)+'px');
      p.style.setProperty('--dy', (-(50+Math.random()*150))+'px');
      p.style.setProperty('--rot', ((Math.random()-.5)*900)+'deg');
      p.style.animationDelay = (Math.random()*.12)+'s';
      stage.appendChild(p);
      (function(el){ setTimeout(function(){ el.remove(); }, 2000); })(p);
    }
  }
  function celebrate(withConfetti){
    cheering = true;
    hop('hop3');
    if(withConfetti) confetti();
    clearTimeout(cheerTO);
    cheerTO = setTimeout(function(){ cheering = false; lastCap=''; render(); }, 2500);
  }

  stage.addEventListener('click', function(e){
    hop('hop');
    var rect = stage.getBoundingClientRect();
    for(var i=0;i<3;i++){
      var h = document.createElement('span'); h.className='heart'; h.textContent='♥';
      h.style.left = (e.clientX-rect.left-8+(i-1)*14)+'px';
      h.style.top = (e.clientY-rect.top-16-i*6)+'px';
      h.style.animationDelay = (i*.07)+'s';
      stage.appendChild(h);
      (function(el){ setTimeout(function(){ el.remove(); }, 1200); })(h);
    }
  });
  stage.addEventListener('pointerenter', function(e){ if(e.pointerType==='mouse'){ hovering=true; updateChar(); } });
  stage.addEventListener('pointerleave', function(){ hovering=false; updateChar(); });

  /* le regard suit le curseur */
  var rafId = null, px = 0, py = 0, lastLook = Date.now();
  function look(){
    rafId = null;
    var r = charEl.getBoundingClientRect();
    var dx = (px-(r.left+r.width/2))/(window.innerWidth*.45);
    var dy = (py-(r.top+r.height*.4))/(window.innerHeight*.45);
    dx = Math.max(-1,Math.min(1,dx)); dy = Math.max(-1,Math.min(1,dy));
    charEl.style.setProperty('--ex', dx.toFixed(3));
    charEl.style.setProperty('--ey', dy.toFixed(3));
  }
  if(!RM){
    window.addEventListener('pointermove', function(e){
      px = e.clientX; py = e.clientY; lastLook = Date.now();
      if(!rafId) rafId = requestAnimationFrame(look);
    }, {passive:true});
    document.documentElement.addEventListener('mouseleave', function(){
      charEl.style.setProperty('--ex',0); charEl.style.setProperty('--ey',0);
    });
    setInterval(function(){
      if(hovering || Date.now()-lastLook<2800) return;
      var gx = (Math.random()*2-1)*.75, gy = (Math.random()*2-1)*.45;
      charEl.style.setProperty('--ex', gx.toFixed(3));
      charEl.style.setProperty('--ey', gy.toFixed(3));
      setTimeout(function(){
        if(!hovering && Date.now()-lastLook>2000){
          charEl.style.setProperty('--ex', '0');
          charEl.style.setProperty('--ey', '0');
        }
      }, 700+Math.random()*800);
    }, 3800);
  }

  /* ---------- Interactions ---------- */
  function selectSession(id){
    stop(); S.sel = id; mode='focus';
    var s = cur(); if(s && s.status==='done'){ s.rem = s.min*60; s.status='idle'; }
    save(); render();
  }
  $('#list').addEventListener('click', function(e){
    var li = e.target.closest('li'); if(!li) return;
    var id = +li.dataset.id;
    if(e.target.classList.contains('x')){
      if(id===S.sel) stop();
      S.sessions = S.sessions.filter(function(s){return s.id!==id});
      if(id===S.sel) S.sel = S.sessions.length ? S.sessions[0].id : null;
      save(); render(); return;
    }
    selectSession(id);
  });
  $('#list').addEventListener('keydown', function(e){
    if((e.key==='Enter'||e.key===' ') && e.target.tagName==='LI'){ e.preventDefault(); selectSession(+e.target.dataset.id); }
  });

  function openAdd(){
    $('#addForm').classList.add('open'); $('#addLink').style.display='none';
    $('#newName').value=''; $('#newMin').value=25; $('#newName').focus();
  }
  function closeAdd(){ $('#addForm').classList.remove('open'); $('#addLink').style.display=''; }
  function addSession(){
    var name = $('#newName').value.trim() || 'Focus session';
    var min = Math.max(1, Math.min(180, parseInt($('#newMin').value,10) || 25));
    var s = {id:S.nextId++, name:name, min:min, rem:min*60, status:'idle'};
    S.sessions.push(s); newId = s.id; closeAdd(); selectSession(s.id);
  }
  $('#addLink').addEventListener('click', openAdd);
  $('#addNo').addEventListener('click', closeAdd);
  $('#addOk').addEventListener('click', addSession);
  $('#newName').addEventListener('keydown', function(e){ if(e.key==='Enter') addSession(); if(e.key==='Escape') closeAdd(); });
  $('#newMin').addEventListener('keydown', function(e){ if(e.key==='Enter') addSession(); });

  goBtn.addEventListener('click', function(){
    var s = cur();
    if(mode==='focus' && !s){ openAdd(); return; }
    if(running) pause(); else start();
  });
  segF.addEventListener('click', function(){ setMode('focus'); });
  segB.addEventListener('click', function(){ setMode('break'); });
  $('#resetBtn').addEventListener('click', resetTimer);
  $('#toggleSide').addEventListener('click', function(){
    var c = $('#card').classList.toggle('collapsed');
    $('#toggleSide').classList.toggle('flip', c);
  });
  document.addEventListener('keydown', function(e){
    if(e.code==='Space' && !/INPUT|BUTTON|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.tagName!=='LI'){
      e.preventDefault(); goBtn.click();
    }
  });
  window.addEventListener('resize', movePill);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(movePill);

  /* ---------- Settings ---------- */
  var ovl = $('#ovl'), armed = false;
  function openSettings(){
    $('#sBrk').value = S.settings.brk; $('#sLng').value = S.settings.lng;
    $('#sSound').setAttribute('aria-checked', S.settings.sound);
    ovl.classList.add('open'); $('#sBrk').focus();
  }
  function closeSettings(){
    ovl.classList.remove('open'); armed=false; var b=$('#sReset'); b.textContent='Clear all data'; b.classList.remove('arm');
  }
  function applySettings(){
    var b = parseInt($('#sBrk').value,10), l = parseInt($('#sLng').value,10);
    if(b>0) S.settings.brk = Math.min(60,b);
    if(l>0) S.settings.lng = Math.min(90,l);
    if(mode==='break' && !running) brkRem = breakLen();
    save(); render();
  }
  $('#setBtn').addEventListener('click', openSettings);
  $('#sDone').addEventListener('click', closeSettings);
  ovl.addEventListener('click', function(e){ if(e.target===ovl) closeSettings(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && ovl.classList.contains('open')) closeSettings(); });
  $('#sBrk').addEventListener('change', applySettings);
  $('#sLng').addEventListener('change', applySettings);
  $('#sSound').addEventListener('click', function(){
    S.settings.sound = !S.settings.sound;
    this.setAttribute('aria-checked', S.settings.sound);
    if(S.settings.sound){ ensureAudio(); chime(); }
    save();
  });
  $('#sReset').addEventListener('click', function(){
    if(!armed){ armed=true; this.textContent='Tap again to confirm'; this.classList.add('arm'); return; }
    stop(); S = defaults(); mode='focus'; brkRem = breakLen(); lastCount = 0; save(); closeSettings(); render();
  });

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='hidden') persistNow();
  });
  window.addEventListener('pagehide', persistNow);

  function restoreSessionMemory(){
    if(S.running && S.endAt){
      var left = Math.max(0, Math.ceil((S.endAt-Date.now())/1000));
      setRem(left);
      if(left<=0){
        S.running = false; S.endAt = 0;
        complete();
        return;
      }
      var s = cur();
      if(mode==='focus' && s) s.status = (left<s.min*60 && left>0) ? 'paused' : 'idle';
    }
    S.running = false; S.endAt = 0;
    save();
  }
  restoreSessionMemory();
  render();
})();
</script>
</body>
</html>
